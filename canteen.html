<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Campus Mate - Canteen</title>
    <link rel="stylesheet" href="project.css">
    <link rel="stylesheet" href="newtheme.css">
    <script src="jsfiles/theme.js" defer></script>
</head>
<body>
    <header>
        <div class="header-copy">
            <h1>Campus Mate - Canteen booking</h1>
            <p>Book your meal at the best canteens on campus!</p>
        </div>
        <nav>
            <div>
            <select onchange="if (this.value) window.location.href=this.value;">
                <option value="">Menu</option>
                <option value="homepage.html">Home</option>
                <option value="main.html">Class Finder</option>
                <option value="canteen.html">Canteen</option>
                <option value="survey.html">Survey</option>
                <option value="login.html">Logout</option>
            </select>
            </div>
        </nav>
    </header>
 
<main class="page canteen-page">
  <section class="card canteen-card">

    <h1>Book Your Meal🥪</h1>

    <form>
        <!-- Canteen Selection -->
        <label for="canteen">Select your fav food place:🍽</label><br>
        <select id="canteen" name="canteen">
            <option value="Select Canteen">Select Canteen</option>
            <option value="cc">CC</option>
            <option value="talk-of-the-town">Talk of the Town</option>
            <option value="chai-sutta-cafe">Chai Sutta Cafe</option>
            <option value="kitchen-ette">kitchen Ette</option>
            <option value="food-square">Food Square</option>
            <option value="bake-studio">Bake Studio</option>
            <option value="lovely-sweets">Lovely Sweets</option>
        </select>
        <br><br>

        <!-- Food Item Selection -->
        <label for="food">What's the mood today:😋</label><br>
        <select id="food" name="food">
            <option value="Select Food" data-price="0">Select Food</option>
            <option value="rajma-chawal" data-price="80">Rajma Chawal - ₹80</option>
            <option value="roti-sabji" data-price="60">Roti Sabji - ₹60</option>
            <option value="masala-dosa" data-price="90">Masala Dosa - ₹90</option>
            <option value="white-sauce-pasta" data-price="110">White Sauce Pasta - ₹110</option>
            <option value="honey-chilli-potatoes" data-price="100">Honey Chilli Potatoes - ₹100</option>
        </select>
        <br><br>

        <!-- Beverage Selection -->
        <label for="beverage">Need something to drink?🥂:</label><br>
        <select id="beverage" name="beverage">
            <option value="Select Beverage" data-price="0">Select Beverage</option>
            <option value="chai" data-price="20">Chai - ₹20</option>
            <option value="hot-coffee" data-price="40">Hot coffee - ₹40</option>
            <option value="cold-coffee" data-price="35">cold coffee - ₹35</option>
            <option value="cold-drink" data-price="45">Cold drink - ₹45</option>
            <option value="fruit-juice" data-price="50">Fruit Juice - ₹50</option>
            <option value="hot-chocolate" data-price="55">Hot chocolate - ₹55</option>
            <option value="water-bottle" data-price="20">Water bottle - ₹20</option>
        </select>
        <br><br>

        <!-- Payment Method Selection -->
        <label for="payment">Choose Payment Method: 💳</label>
        <select id="payment" name="payment" required>
            <option value="">Select payment option</option>
            <option value="cash">Cash</option>
            <option value="upi">UPI</option>
        </select>

        <button type="submit">Submit</button>
    </form>
</section>
</main>
<footer>
    <p>Campus Mate © 2026 | CA2 Project- Jiya, Manasvi, Tanushka K2P26WE</p>
</footer>
</body>
</html>
